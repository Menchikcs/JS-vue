<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Налаштування профілю</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="profile-card" id="profileCard">
    <p class="tag">Особистий кабінет</p>
    <h1>Налаштування профілю</h1>
    <p id="greeting">Вітаємо, гостю!</p>

    <label for="username">Ваше ім'я</label>
    <input id="username" type="text" placeholder="Введіть ваше ім'я">

    <button id="saveBtn">Зберегти зміни</button>
    <p id="saveStatus"><b>Зміни не збережено</b></p>

    <button id="themeBtn" class="secondary">Темна тема</button>

    <button id="infoBtn" class="secondary">Показати додаткову інформацію</button>
    <p class="hidden" id="infoBlock">Тут містяться конфіденційні дані профілю, налаштування безпеки та сповіщень.</p>
</main>

<script src="script.js" defer></script>
</body>
</html>
